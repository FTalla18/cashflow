<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="../index.html" style="width:1300px;height:900px;border:0"></iframe>
<script>
// Starts a game, taps Ask Cash → "Chat about my numbers", and records what the Botpress chat sends and receives.
const out=[]; window.alertSeen=0, sleep=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{ const w=f.contentWindow,d=f.contentDocument; try{w.localStorage.clear()}catch{} w.alert=(m)=>out.push('ALERT: '+m);
  await sleep(500); d.querySelector('[data-act="startLocal"]').click(); await sleep(600);
  // record what reaches Botpress
  const hook=setInterval(()=>{ if(w.botpress && !w.botpress.__hooked && w.botpress.sendMessage){ const orig=w.botpress.sendMessage.bind(w.botpress); w.botpress.sendMessage=async(m)=>{ try{ const r=await orig(m); out.push('SENT OK: '+String(m).split('\n')[0]); return r; }catch(e){ out.push('SEND ERR '+(performance.now()|0)+': '+e); throw e; } }; ['webchat:ready','webchat:opened','webchat:initialized','conversation'].forEach(ev=>{ try{ w.botpress.on(ev,()=>out.push('EVENT '+ev+' @'+(performance.now()|0))); }catch{} }); out.push('methods: '+Object.keys(w.botpress).join(',')); try{ w.botpress.on('message',(m)=>{ const t=JSON.stringify(m.payload||m).slice(0,400); out.push('MSG: '+t); }); }catch(e){ out.push('on() failed '+e); } w.botpress.__hooked=true; } },50);
  d.querySelector('#rail [data-act="coach"]').click(); await sleep(300);
  out.push('snapshot button: '+!!d.getElementById('chatMine'));
  d.getElementById('chatMine').click();
  for(let i=0;i<40;i++){ await sleep(1000); if(out.filter(x=>x.startsWith('MSG')).length>=2) break; }
  await sleep(3000);
  fetch('/log',{method:'POST',body:out.join('\n')});
};
</script></body></html>
